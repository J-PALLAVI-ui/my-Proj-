
# Netlify Build Configuration for FujiNova
[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci && npm run build"

[build.environment]
  NODE_VERSION = "22"
  VITE_API_BASE_URL = "https://web-production-03e494fe.up.railway.app"

# SPA Fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
